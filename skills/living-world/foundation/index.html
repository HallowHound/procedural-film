<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Long Way Home · Living World</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#10191e;color:#e8e1cf}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
canvas{display:block;width:100%;height:100%;object-fit:contain}
#controls{position:fixed;left:3%;right:3%;bottom:20px;display:flex;gap:14px;align-items:center;padding:14px 18px;border:1px solid #ffffff20;border-radius:10px;background:#10191ee8;opacity:0;transition:opacity .35s}
body:hover #controls,#controls:focus-within{opacity:1}button,select{font:inherit;color:inherit;background:#243238;border:1px solid #ffffff30;border-radius:5px;padding:6px 10px}
#seek{flex:1;min-width:60px}#label{font-size:12px;min-width:180px}label{font-size:12px;white-space:nowrap}
.wallpaper #controls,.render #controls{display:none!important}.wallpaper{cursor:none}
#error{position:fixed;inset:20%;padding:24px;background:#10191ef5;color:#f2b1a3;white-space:pre-wrap}
@media(max-width:700px){#controls{gap:7px;padding:10px}#label{min-width:0;max-width:110px}label{display:none}}
</style>
</head>
<body>
<canvas id="world" aria-label="A quiet journey through a mountain valley to a lakeside camp"></canvas>
<div id="controls">
<button id="play" type="button" aria-label="Pause or resume">Pause</button>
<span id="label"></span>
<input id="seek" type="range" min="0" max="900" step="0.1" value="0" aria-label="Episode time">
<select id="speed" aria-label="Playback speed"><option value="1">1×</option><option value="4">4×</option><option value="16">16×</option><option value="60">60× review</option></select>
<label><input id="loop" type="checkbox"> Dissolve loop</label>
</div>
<pre id="error" hidden></pre>
<script src="src/config.js"></script>
<script src="src/world.js"></script>
<script src="src/scene.js"></script>
<script src="src/player.js"></script>
</body>
</html>
